name: Daily weather collection

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}   

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger collection on Render
        run: |
          curl --fail --show-error --silent \
               --max-time 180 \
               -X POST \
               -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
               https://weather-verify.onrender.com/api/cron/run
